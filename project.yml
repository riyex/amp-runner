name: AmpRunner

options:
  bundleIdPrefix: com.riyex
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# AmpRunnerCore is consumed as a local Swift package rather than being compiled into the
# app target, so the same sources stay buildable and testable with `swift test` on any
# platform.
packages:
  AmpRunnerCore:
    path: .

# Browsable in Xcode but not compiled or copied into the bundle. The Info.plist and the
# entitlements files are handwritten and referenced through build settings, so XcodeGen's
# `info:` / `entitlements:` generators are deliberately not used — they would overwrite
# these files on every `xcodegen generate`.
fileGroups:
  - README.md
  - ARCHITECTURE.md
  - project.yml
  - Package.swift
  - App/Resources/Info.plist
  - App/Resources/AmpRunner.entitlements
  - App/Resources/AmpRunner-AppStore.entitlements

settingGroups:
  common:
    base:
      PRODUCT_NAME: AmpRunner
      PRODUCT_BUNDLE_IDENTIFIER: com.riyex.amprunner
      INFOPLIST_FILE: App/Resources/Info.plist
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: "YES"
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: "NO"
      GENERATE_INFOPLIST_FILE: "NO"
      COMBINE_HIDPI_IMAGES: "YES"
      ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targetTemplates:
  AmpRunnerApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    preBuildScripts:
      - name: Copy LaunchAgent plist
        inputFiles:
          - "$(SRCROOT)/App/Resources/com.riyex.amprunner.agent.plist"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/com.riyex.amprunner.agent.plist"
        script: |
          set -euo pipefail
          launch_agent_dir="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchAgents"
          mkdir -p "${launch_agent_dir}"
          cp "${SRCROOT}/App/Resources/com.riyex.amprunner.agent.plist" "${launch_agent_dir}/com.riyex.amprunner.agent.plist"
    postBuildScripts:
      - name: Stamp Debug Build Number
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          set -eu
          if [ "${CONFIGURATION}" = "Debug" ]; then
            build_number=$(date -u +%Y%m%d.%H%M%S)
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${build_number}" \
              "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          fi
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
          - "Resources/com.riyex.amprunner.agent.plist"
    dependencies:
      - package: AmpRunnerCore
        product: AmpRunnerCore
      - target: AmpRunnerMonitor
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers

targets:
  AmpRunnerMonitor:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/AmpRunnerMonitor
    dependencies:
      - package: AmpRunnerCore
        product: AmpRunnerMonitorSupport
    settings:
      base:
        PRODUCT_NAME: AmpRunnerMonitor
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"

  AmpRunner:
    templates: [AmpRunnerApp]
    settings:
      groups: [common]
      base:
        CODE_SIGN_ENTITLEMENTS: App/Resources/AmpRunner.entitlements

  # Same sources, sandboxed entitlements. Kept so the App Store option exists if Apple's
  # review stance changes, or if the user only needs one self-contained directory.
  AmpRunner-AppStore:
    templates: [AmpRunnerApp]
    settings:
      groups: [common]
      base:
        CODE_SIGN_ENTITLEMENTS: App/Resources/AmpRunner-AppStore.entitlements

schemes:
  AmpRunner:
    build:
      targets:
        AmpRunnerMonitor: all
        AmpRunner: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release

  AmpRunner-AppStore:
    build:
      targets:
        AmpRunnerMonitor: all
        AmpRunner-AppStore: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
