name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test release tooling
        run: ./Scripts/tests/validate_release_branch_test.sh

      - name: Run Swift tests
        run: swift test

      - name: Validate property list
        run: plutil -lint App/Resources/Info.plist

      - name: Validate asset catalogs
        run: find App/Resources/Assets.xcassets -name Contents.json -print0 | xargs -0 -n1 jq empty

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: ./Scripts/generate_project.sh

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project AmpRunner.xcodeproj \
            -scheme AmpRunner \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
