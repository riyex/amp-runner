name: Release Preparation

on:
  push:
    branches:
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare unsigned archive
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        id: release
        run: |
          version=$(./Scripts/validate_release_branch.sh "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test release tooling
        run: ./Scripts/tests/run_release_tool_tests.sh

      - name: Run Swift tests
        run: swift test

      - name: Validate property list
        run: plutil -lint App/Resources/Info.plist

      - name: Validate asset catalogs
        run: find App/Resources/Assets.xcassets -name Contents.json -print0 | xargs -0 -n1 jq empty

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: ./Scripts/generate_project.sh

      - name: Create unsigned archive
        run: |
          xcodebuild \
            -project AmpRunner.xcodeproj \
            -scheme AmpRunner \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$PWD/build/AmpRunner-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="AmpRunner-${VERSION}-unsigned-not-for-distribution.zip"
          checksum="AmpRunner-${VERSION}-unsigned-not-for-distribution.sha256"
          ditto -c -k --sequesterRsrc --keepParent \
            build/AmpRunner-unsigned.xcarchive \
            "build/$archive"
          (cd build && shasum -a 256 "$archive" > "$checksum")

      - name: Upload unsigned validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AmpRunner-${{ steps.release.outputs.version }}-unsigned-not-for-distribution
          path: |
            build/AmpRunner-${{ steps.release.outputs.version }}-unsigned-not-for-distribution.zip
            build/AmpRunner-${{ steps.release.outputs.version }}-unsigned-not-for-distribution.sha256
          if-no-files-found: error
          retention-days: 7
